[project]
name = "whatsapp-agent-service"
version = "0.1.0"
description = "Approval-gated WhatsApp agent: orchestrates an LLM with read-only and mutating tools on top of the whatsapp-mcp Go bridge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "python-socketio>=5.16.4",
    "aiohttp>=3.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: formatter cannot split long string literals (prompts, SQL); reviewed manually
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
